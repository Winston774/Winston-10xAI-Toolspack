<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><style>
@font-face{font-family:Caption;src:url('assets/caption.woff2') format('woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}h1,h2,p{margin:0}
#editorial-stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:Caption,sans-serif;color:@@INK@@;background:@@BACKGROUND@@}
.header{position:absolute;left:90px;top:22px;right:90px;height:38px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:@@SECONDARY@@}.header b{font-size:28px;color:@@INK@@;letter-spacing:3px}.rule{position:absolute;left:90px;right:90px;top:68px;height:2px;background:@@INK@@;opacity:.2}
.narration-card{position:absolute;left:90px;right:90px;top:135px;height:610px}.card-layout{width:100%;height:100%;display:flex;gap:50px;align-items:center}.card-copy{flex:1;min-width:0}.eyebrow{font-size:30px;color:@@SECONDARY@@;line-height:1.35;margin-bottom:24px}.phrase{font-size:64px;line-height:1.35;font-weight:650;margin-top:24px}.accent{font-size:72px;background:@@ACCENT@@;color:@@ACCENT_TEXT@@;display:table;padding:5px 18px}.art{width:640px;height:560px;flex:0 0 640px;display:flex;align-items:center;justify-content:center}.art img{width:100%;height:100%;object-fit:contain}.art.art-portrait{width:520px;flex-basis:520px}.art.art-portrait img{width:500px;height:550px;border:14px solid white;box-shadow:12px 12px 0 #142c3216;object-fit:contain}
.source-frame{position:absolute;left:320px;top:80px;width:1280px;height:720px;transform-origin:0 0;box-shadow:0 8px 30px #142c3220;background:#101010}.source-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.concept{position:absolute;left:90px;top:145px;width:560px;height:595px;background:#ffffffb8;padding:26px 28px;box-shadow:9px 10px 0 #142c3215;border-top:6px solid @@ACCENT@@}.concept-kicker{font-size:22px;color:@@SECONDARY@@;line-height:1.35;margin-bottom:10px}.concept h2{font-size:40px;line-height:1.35;margin-bottom:18px}.concept-item{display:flex;align-items:center;gap:18px;border:2px solid #142c3220;border-radius:6px;padding:14px;margin-top:8px;font-size:32px;line-height:1.35;background:@@BACKGROUND@@}.concept-item.emphasis{background:@@ACCENT@@;color:@@ACCENT_TEXT@@;border-color:@@ACCENT@@}.step-number{width:44px;height:44px;flex:0 0 44px;background:@@ACCENT@@;color:@@ACCENT_TEXT@@;border-radius:50%;display:grid;place-items:center;font-size:26px}.emphasis .step-number{background:@@ACCENT_TEXT@@;color:@@ACCENT@@}.connector{height:18px;margin:4px 0 0 28px;display:flex;align-items:center;color:@@ACCENT@@;font-size:28px}.concept-foot{font-size:23px;line-height:1.4;margin-top:14px;color:@@SECONDARY@@}
.narration-note{position:absolute;left:90px;top:773px;font-size:25px;color:@@SECONDARY@@}.credit{position:absolute;left:90px;top:778px;font-size:25px;line-height:30px;color:white;background:#181818;padding:4px 10px;letter-spacing:1px}.chapter{position:absolute;left:420px;top:22px;right:500px;height:38px;display:flex;justify-content:center;align-items:center;font-size:26px;color:@@SECONDARY@@;background:@@BACKGROUND@@}
.caption-band{position:absolute;left:0;top:822px;width:1920px;height:258px;background:#181818;z-index:35}.caption{position:absolute;left:96px;top:822px;width:1728px;height:258px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center;z-index:40;color:#FFFFFF}.caption p{width:100%;margin:0}.caption .zh{font-size:56px;line-height:1.18;font-weight:650}.caption .en{font-size:34px;line-height:1.22;font-weight:400;color:#E5E8E6}
</style></head><body><div id="editorial-stage" data-composition-id="editorial-stage" data-duration="@@TOTAL@@" data-width="1920" data-height="1080">
<div id="brand-header" class="clip header" data-start="0" data-duration="@@TOTAL@@" data-track-index="10"><b>@@PUBLISHER@@</b><span>@@LABEL@@</span></div><div id="brand-rule" class="rule" data-layout-ignore></div>
@@SCENES@@<div id="caption-band" class="caption-band" data-layout-ignore></div>@@CAPTIONS@@
</div><script>
window.__timelines=window.__timelines||{};const cfg=@@CONFIG@@;const tl=gsap.timeline({paused:true});
function appear(selector,time){tl.fromTo(selector,{opacity:0,y:20},{opacity:1,y:0,duration:.45,ease:'power2.out',immediateRender:true},time)}
cfg.reveals.forEach(r=>appear(r.selector,r.at));
for(const source of cfg.sources){const target='#frame-'+source.id;tl.set(target,{autoAlpha:0},0);tl.set(target,{autoAlpha:1},source.start);tl.set(target,{autoAlpha:0},source.end);
for(const marker of source.markers){const card='#'+marker.id,full=cfg.geometry.source_box,inset=cfg.geometry.source_inset_box;tl.set(card,{autoAlpha:0},0);tl.to(target,{x:inset[0]-full[0],y:inset[1]-full[1],scale:inset[2]/full[2],duration:.7,ease:'power2.inOut'},marker.start);tl.fromTo(card,{autoAlpha:0,x:-20},{autoAlpha:1,x:0,duration:.45,ease:'power2.out',immediateRender:true},marker.start+.35);appear(card+'-title',marker.start+.7);marker.steps.forEach((step,i)=>{appear(card+'-step-'+i,step.at);if(i>0)appear(card+'-connector-'+i,step.at)});appear(card+'-foot',marker.steps[marker.steps.length-1].at+.3);tl.to(card,{autoAlpha:0,x:-20,duration:.3},marker.end);tl.to(target,{x:0,y:0,scale:1,duration:.7,ease:'power2.inOut'},marker.end)}}
window.__timelines['editorial-stage']=tl;
</script></body></html>
