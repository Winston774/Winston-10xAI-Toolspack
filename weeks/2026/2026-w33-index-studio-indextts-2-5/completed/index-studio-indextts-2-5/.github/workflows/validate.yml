name: Validate Index Studio

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight HTML UI test dependencies
        run: >-
          python -m pip install
          fastapi==0.116.2
          httpx==0.28.1
          opencc-python-reimplemented==0.1.7
          python-multipart==0.0.20
          pytest>=7.0
      - name: Run release checks
        run: npm run validate
      - name: Run HTML UI contract tests
        run: python -m pytest tests/test_htmlui.py -q
      - name: Compile local server
        run: python -m py_compile htmlui_server.py
